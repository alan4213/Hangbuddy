<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangbuddy - Email Verification</title>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
    <h1>Hangbuddy</h1>
    <p id="message">Verifying your email...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAe5V6rNVXF54LT6aYkQwlKHNXA248w3KM",
      authDomain: "hangbuddy-4a1e9.firebaseapp.com",
      projectId: "hangbuddy-4a1e9",
      storageBucket: "hangbuddy-4a1e9.firebasestorage.app",
      messagingSenderId: "940032181149",
      appId: "1:940032181149:web:27ac2887b6fb8571576574"
    };

    firebase.initializeApp(firebaseConfig);

    if (firebase.auth().isSignInWithEmailLink(window.location.href)) {
      // Try to get email from URL parameters first
      const urlParams = new URLSearchParams(window.location.search);
      let email = urlParams.get('email');
      
      // If not in URL, try localStorage
      if (!email) {
        email = window.localStorage.getItem('emailForSignIn');
      }
      
      if (email) {
        firebase.auth().signInWithEmailLink(email, window.location.href)
          .then(() => {
            window.localStorage.removeItem('emailForSignIn');
            document.getElementById('message').innerHTML = 
              'Email verified successfully! Please return to the Hangbuddy app to continue.';
          })
          .catch((error) => {
            console.error('Verification error:', error);
            document.getElementById('message').innerHTML = 
              'Verification failed. Please try again in the app.';
          });
      } else {
        document.getElementById('message').innerHTML = 
          'Email verification link detected. Please return to the Hangbuddy app to complete the process.';
      }
    } else {
      document.getElementById('message').innerHTML = 
        'Welcome to Hangbuddy! Please download the mobile app to get started.';
    }
  </script>
</body>
</html>
